<style>
  /* === Shared chrome (mirrors scripts/lib/chrome.mjs) === */
  @font-face { font-family:'Satoshi'; src:url('/fonts/satoshi/Satoshi-Variable.woff2') format('woff2'); font-weight:300 900; font-display:swap; font-style:normal; }
  @font-face { font-family:'Satoshi'; src:url('/fonts/satoshi/Satoshi-VariableItalic.woff2') format('woff2'); font-weight:300 900; font-display:swap; font-style:italic; }
  @font-face { font-family:'JetBrains Mono'; src:url('/fonts/jetbrains-mono/jetbrains-mono-latin.woff2') format('woff2'); font-weight:400 500; font-display:swap; font-style:normal; }
  @font-face { font-family:'Patrick Hand'; src:url('/fonts/patrick-hand/patrick-hand-latin.woff2') format('woff2'); font-weight:400; font-display:swap; font-style:normal; }
  .icon { width:1em; height:1em; fill:currentColor; display:inline-block; vertical-align:-0.125em; flex-shrink:0; }
  :root {
    --bg:#0A0A0A; --surface:#111111; --surface-2:#161616;
    --border:#1E1E1E; --border-hover:#2A2A2A;
    --text:#E8E4DF; --text-dim:#8a8a8a;
    --accent:#E5A54B; --accent-dim:rgba(229,165,75,0.12);
    --warn:#E5A54B; --warn-bg:rgba(229,165,75,0.08);
    --cli:#7AB3D6; --svr:#9FD89F; --err:#E48484;
    --mono:'JetBrains Mono',monospace;
    --sans:'Satoshi',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mark:'Patrick Hand',cursive;
    --space-3:8px; --space-4:12px; --space-5:16px; --space-6:24px;
    --space-7:32px; --space-8:48px; --space-9:64px;
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100dvh;}
  ::selection{background:var(--accent);color:var(--bg);}

  html{scrollbar-width:thin;scrollbar-color:rgba(232,228,223,0.18) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(232,228,223,0.18);border-radius:10px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(229,165,75,0.45);background-clip:padding-box;}

  header.site-header{position:fixed;top:0;left:0;right:0;height:clamp(52px,6vw,64px);z-index:100;padding:0 clamp(1rem,3vw,1.5rem);background:var(--bg);display:flex;align-items:center;}
  .icon-bar{display:inline-flex;align-items:center;}
  .icon-bar a{color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;min-width:44px;min-height:44px;font-size:clamp(1.4rem,1.5vw,1.65rem);transition:color 0.2s,filter 0.2s,transform 0.2s;text-decoration:none;}
  .icon-bar a:hover{color:var(--accent);}
  .icon-bar a.icon-bar-agent{color:var(--accent);filter:drop-shadow(0 0 6px rgba(229,165,75,0.25));}
  .icon-bar a.icon-bar-agent:hover{filter:drop-shadow(0 0 10px rgba(229,165,75,0.55));transform:scale(1.05);}

  .aa-mark{position:fixed;bottom:clamp(16px,3vw,32px);right:clamp(16px,3vw,32px);z-index:50;text-decoration:none;line-height:1;opacity:0.7;transition:opacity 0.2s;font-family:var(--mark);}
  .aa-mark:hover{opacity:1;}
  .aa-mark svg{width:clamp(44px,5vw,60px);height:auto;overflow:visible;display:block;}
  .aa-mark svg text{font-family:var(--mark);}

  .icon-bar a:focus-visible,
  .aa-mark:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-sm);}

  /* === Page layout === */
  main.terminal-page {
    max-width: 1080px;
    margin: 0 auto;
    padding: calc(clamp(52px,6vw,64px) + var(--space-7))
             clamp(var(--space-5), 4vw, var(--space-7))
             calc(var(--space-9) + 80px);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .page-header h1 {
    font-family: var(--mono);
    font-size: clamp(1.4rem, 2.4vw, 1.85rem);
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .page-header .tagline {
    color: var(--text-dim);
    margin-top: var(--space-3);
    font-size: 0.95rem;
  }
  .page-header .tagline a { color: var(--accent); text-decoration: none; }
  .page-header .tagline a:hover { text-decoration: underline; }

  /* === Toolbar === */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    align-items: center;
    padding: var(--space-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 32px;
  }
  .btn:hover { border-color: var(--border-hover); color: var(--accent); }
  .btn.on {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filter-input {
    flex: 1;
    min-width: 180px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 0.8rem;
    min-height: 32px;
  }
  .filter-input:focus { outline: none; border-color: var(--accent); }
  .toolbar .count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-left: auto;
  }

  /* === Terminal feed === */
  .feed {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.55;
    max-height: 72vh;
    overflow-y: auto;
    padding: var(--space-4);
  }
  .feed-empty {
    color: var(--text-dim);
    text-align: center;
    padding: var(--space-8) var(--space-5);
    font-family: var(--mono);
    font-size: 0.85rem;
  }
  .feed-empty a { color: var(--accent); text-decoration: none; }
  .feed-empty a:hover { text-decoration: underline; }

  .row {
    padding: 6px 8px 6px 12px;
    margin-bottom: 2px;
    border-left: 2px solid transparent;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  .row:hover { background: rgba(255,255,255,0.02); }
  .row .ts { color: var(--text-dim); margin-right: var(--space-3); }
  .row .side { font-weight: 500; margin-right: var(--space-3); display:inline-block; min-width: 3ch; }
  .row[data-side="CLI"] .side { color: var(--cli); }
  .row[data-side="SVR"] .side { color: var(--svr); }
  .row .tag {
    color: var(--accent);
    margin-right: var(--space-3);
  }
  .row .payload {
    color: var(--text);
    opacity: 0.9;
  }
  .row.warn {
    border-left-color: var(--warn);
    background: var(--warn-bg);
  }
  .row.warn::before {
    content: "! ";
    color: var(--warn);
    font-weight: 600;
  }
  .row.deflect { opacity: 0.6; }
  .row.error { border-left-color: var(--err); }
  .row.error .side, .row.error .tag { color: var(--err); }
  .row.turn-sep {
    border-top: 1px dashed var(--border);
    margin-top: var(--space-4);
    padding-top: var(--space-4);
  }

  @media (max-width: 600px) {
    .row { font-size: 0.72rem; }
    .feed { padding: var(--space-3); }
    .toolbar .count { width: 100%; margin-left: 0; text-align: right; }
  }
</style>
</head>

(function(){
  const s=document.getElementById('aa-stroke'),f=document.getElementById('aa-fill'),d=document.getElementById('dot-fill');
  if(!s||!f||!d)return;
  document.fonts.ready.then(()=>{
    const len=s.getComputedTextLength();
    d.setAttribute('x',4+len-2);f.setAttribute('x',4);
    const dl=len*2;s.style.strokeDasharray=dl;s.style.strokeDashoffset=dl;s.style.opacity='1';
    s.getBoundingClientRect();
    s.style.transition='stroke-dashoffset 1.2s cubic-bezier(0.25,0.1,0.25,1)';s.style.strokeDashoffset='0';
    s.addEventListener('transitionend',function h(e){if(e.propertyName!=='stroke-dashoffset')return;
      s.removeEventListener('transitionend',h);
      f.style.transition='opacity 0.2s';f.style.opacity='1';
      d.style.transition='opacity 0.2s';d.style.opacity='1';
      s.style.transition='opacity 0.25s ease 0.05s';s.style.opacity='0';
    });
  });
})();
</script>

<script>
// =============================================================
// /enter/log . glassbox observability viewer
// =============================================================
// Reads sessionStorage ring buffer written by /enter (key: enterDebugRing),
// subscribes to BroadcastChannel('enter-debug') for live updates, renders
// each entry as a terminal row. No network calls — purely a consumer of
// what /enter captures.
//
// Layout decisions:
//   - Entries pushed in arrival order. New entry rendered with a small fade-in.
//   - Autoscroll on by default; user can pause.
//   - Verbose toggle writes sessionStorage.enterVerbose; /enter reads it on
//     next POST to enable tier-2 server emission.
//   - Filter is substring (not regex) for predictable behavior.
//   - 500-entry ring cap mirrors /enter side.
// =============================================================

const RING_KEY = 'enterDebugRing';
const VERBOSE_KEY = 'enterVerbose';
const RING_MAX = 500;

const feed = document.getElementById('feed');
const feedEmpty = document.getElementById('feed-empty');
const filterInput = document.getElementById('filter');
const btnVerbose = document.getElementById('btn-verbose');
const btnPause = document.getElementById('btn-pause');
const btnClear = document.getElementById('btn-clear');
const countEl = document.getElementById('count');

let entries = [];        // in-memory copy of ring
let autoscroll = true;
let filterStr = '';

// ---- Persistence -------------------------------------------------------
function loadRing() {
  try {
    const raw = sessionStorage.getItem(RING_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function saveRing() {
  try { sessionStorage.setItem(RING_KEY, JSON.stringify(entries)); } catch {}
}

// ---- Rendering ---------------------------------------------------------
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  const ms = String(d.getMilliseconds()).padStart(3,'0');
  return `${hh}:${mm}:${ss}.${ms}`;
}
function fmtPayload(obj) {
  if (obj == null) return '';
  try { return JSON.stringify(obj); } catch { return '(unserializable)'; }
}
// Decide row class based on payload signals — surfaces the bug without devtools.
function rowClass(entry) {
  const p = entry.payload || {};
  const classes = [];
  if (p.fallbackUsed === true) classes.push('warn');
  if (entry.tag === 'route_decision' && (p.type === 'deflect' || p.type === 'fallback')) classes.push('deflect');
  if (entry.tag === 'turn_complete' && p.isError) classes.push('error');
  return classes.join(' ');
}
function rowMatchesFilter(entry) {
  if (!filterStr) return true;
  const haystack = (entry.tag + ' ' + fmtPayload(entry.payload)).toLowerCase();
  return haystack.includes(filterStr);
}
function buildRow(entry, idx, isTurnStart) {
  const div = document.createElement('div');
  div.className = 'row ' + rowClass(entry) + (isTurnStart && idx > 0 ? ' turn-sep' : '');
  div.dataset.side = entry.side;
  div.dataset.idx = idx;
  div.innerHTML =
    `<span class="ts">${escHtml(fmtTime(entry.ts))}</span>` +
    `<span class="side">${escHtml(entry.side)}</span>` +
    `<span class="tag">${escHtml(entry.tag)}</span>` +
    `<span class="payload">${escHtml(fmtPayload(entry.payload))}</span>`;
  return div;
}
// New question = new turn separator. We detect it on `question_submitted`.
function isTurnStart(entry) {
  return entry.side === 'CLI' && entry.tag === 'question_submitted';
}
function renderAll() {
  feed.innerHTML = '';
  const visible = entries.filter(rowMatchesFilter);
  if (visible.length === 0) {
    feed.appendChild(feedEmpty);
    countEl.textContent = entries.length === 0 ? '0 entries' : `0 visible (${entries.length} filtered)`;
    return;
  }
  if (feedEmpty.parentNode) feedEmpty.remove();
  for (let i = 0; i < visible.length; i++) {
    feed.appendChild(buildRow(visible[i], i, isTurnStart(visible[i])));
  }
  countEl.textContent = filterStr
    ? `${visible.length} visible (${entries.length} total)`
    : `${entries.length} entries`;
  if (autoscroll) feed.scrollTop = feed.scrollHeight;
}
function appendOne(entry) {
  entries.push(entry);
  while (entries.length > RING_MAX) entries.shift();
  saveRing();
  if (!rowMatchesFilter(entry)) {
    countEl.textContent = filterStr
      ? `${feed.querySelectorAll('.row').length} visible (${entries.length} total)`
      : `${entries.length} entries`;
    return;
  }
  if (feedEmpty.parentNode) feedEmpty.remove();
  const idx = feed.querySelectorAll('.row').length;
  feed.appendChild(buildRow(entry, idx, isTurnStart(entry)));
  countEl.textContent = filterStr
    ? `${idx + 1} visible (${entries.length} total)`
    : `${entries.length} entries`;
  if (autoscroll) feed.scrollTop = feed.scrollHeight;
}

// ---- Toolbar handlers --------------------------------------------------
function syncVerboseUI() {
  const on = sessionStorage.getItem(VERBOSE_KEY) === '1';
  btnVerbose.textContent = on ? 'verbose: ON' : 'verbose: OFF';
  btnVerbose.classList.toggle('on', on);
  btnVerbose.setAttribute('aria-pressed', on ? 'true' : 'false');
}
btnVerbose.addEventListener('click', () => {
  const cur = sessionStorage.getItem(VERBOSE_KEY) === '1';
  sessionStorage.setItem(VERBOSE_KEY, cur ? '0' : '1');
  syncVerboseUI();
});
btnPause.addEventListener('click', () => {
  autoscroll = !autoscroll;
  // Label + highlight both track the same state: autoscroll ON = gold
  // highlight + "ON" label; autoscroll OFF = no highlight + "OFF" label.
  // No semantic inversion.
  btnPause.textContent = autoscroll ? 'autoscroll: ON' : 'autoscroll: OFF';
  btnPause.classList.toggle('on', autoscroll);
  btnPause.setAttribute('aria-pressed', autoscroll ? 'true' : 'false');
  if (autoscroll) feed.scrollTop = feed.scrollHeight;
});
btnClear.addEventListener('click', () => {
  entries = [];
  try { sessionStorage.removeItem(RING_KEY); } catch {}
  renderAll();
});
filterInput.addEventListener('input', () => {
  filterStr = filterInput.value.trim().toLowerCase();
  renderAll();
});

// ---- Boot --------------------------------------------------------------
syncVerboseUI();
entries = loadRing();
renderAll();

// Live subscription. BroadcastChannel is the primary path; sessionStorage
// is the same-tab fallback (we also write here to mirror what /enter writes,
// so reload replays).
if ('BroadcastChannel' in window) {
  try {
    const ch = new BroadcastChannel('enter-debug');
    ch.addEventListener('message', (ev) => {
      const entry = ev?.data;
      if (!entry || typeof entry !== 'object') return;
      if (!entry.tag || !entry.side || typeof entry.ts !== 'number') return;
      appendOne(entry);
    });
  } catch (err) {
    console.warn('BroadcastChannel failed', err);
  }
}
</script>

</body>
